<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Server</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222 }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px }
    #feed { border: 1px solid #ddd; border-radius: 8px; padding: 8px; min-height: 80px; font-size: 14px }
  </style>
</head>
<body>
  <h1>My Server is running 🚀</h1>
  <p>API: <code>/api/v1</code> &nbsp; Health: <a href="/api/v1/health"><code>/api/v1/health</code></a></p>
  <h3>Live feed (socket.io)</h3>
  <div id="feed">waiting for new posts…</div>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const feed = document.getElementById("feed");
    const socket = io({ transports: ["websocket"] });
    socket.on("welcome", (m) => (feed.textContent = "connected as " + m.id));
    socket.on("post:created", (p) => {
      const d = document.createElement("div");
      d.textContent = "📝 " + p.title;
      feed.append(d);
    });
  </script>
</body>
</html>
